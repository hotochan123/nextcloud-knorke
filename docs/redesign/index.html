<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knorke · Re-Design-Prototyp P1–P12</title>
<style>/*
 * Knorke · Tokens nach der Re-Design-Runde (Entwurf, Stand 29.10.2026)
 *
 * Teil 1  Leisten (HTML, Nextcloud-Vue): Abstände, Radien, Ebenen, Schatten, Leistenhöhen.
 *         Alles hängt an Nextcloud-Variablen; der Wert nach dem Komma ist nur Ersatz.
 *         Akzente laufen ausschließlich über --color-primary-element (Standard #00679e).
 * Teil 2  Leinwand (Konva): eine Palette, Schrift, Linien, Ecken, Schatten, Auswahl.
 *         Konva braucht sRGB-Hex; die Werte sind aus OKLCH abgeleitet (Kommentar je Ton).
 * Teil 3  Dunkelmodus: Variante (a) dunkle Leinwand, Variante (b) helle Leinwand + dunkelgraue Leisten.
 *
 * Kontrastwerte sind berechnet (WCAG 2.x relative Leuchtdichte), nicht geschätzt.
 */

/* ───────────────────────── Teil 1 · Leisten ───────────────────────── */
/* Auf .knorke (App-Wurzel) statt nur :root: Nextcloud setzt Thema-Variablen auch unterhalb von :root
   (z. B. body[data-themes*=dark]); var() wird dort aufgelöst, wo die Eigenschaft steht. */
:root, .knorke {
	/* Akzent: nie fest verdrahten. Nextcloud liefert die Werte je Admin-Einstellung. */
	--k-accent: var(--color-primary-element, #00679e);
	--k-accent-text: var(--color-primary-element-text, #ffffff);
	--k-accent-hover: var(--color-primary-element-hover, color-mix(in oklch, var(--k-accent) 88%, black));
	--k-accent-light: var(--color-primary-element-light, color-mix(in oklch, var(--k-accent) 14%, white));
	--k-accent-light-text: var(--color-primary-element-light-text, color-mix(in oklch, var(--k-accent) 75%, black));

	/* Flächen und Text der Leisten (Nextcloud-Rollen) */
	--k-surface: var(--color-main-background, #ffffff);
	--k-text: var(--color-main-text, #222222);
	--k-text-muted: var(--color-text-maxcontrast, #6b6b6b);          /* 5,33:1 auf Weiß */
	--k-hover: var(--color-background-hover, #f5f5f5);
	--k-border: var(--color-border, #ededed);
	--k-border-strong: var(--color-border-maxcontrast, #7f7f7f);

	/* Status: immer helle Fläche + dunkler Text (Nextcloud-Paare), nie weißer Text */
	--k-info-bg: var(--k-accent-light);        --k-info-text: var(--k-accent-light-text);
	--k-warning-bg: var(--color-warning, #ffeec5); --k-warning-text: var(--color-warning-text, #664700); /* 7,42:1 */
	--k-success-bg: var(--color-success, #d8f3da); --k-success-text: var(--color-success-text, #005416); /* 7,79:1 */
	--k-error-bg: var(--color-error, #ffe7e7);     --k-error-text: var(--color-error-text, #8a0000);     /* 8,57:1 */

	/* Abstände: 4er-Raster */
	--k-space-1: 4px;
	--k-space-2: 8px;
	--k-space-3: 12px;
	--k-space-4: 16px;
	--k-space-5: 24px;
	--k-space-6: 32px;
	--k-inset: 8px;            /* Abstand aller Inseln zum Rand der Leinwand */
	--k-gap: 4px;              /* Abstand zwischen Knöpfen in einer Leiste */
	--k-group-gap: 8px;        /* Abstand zwischen Gruppen (statt Trennlinie) */

	/* Radien: eine Familie für alle Leisten (V15) */
	--k-radius-bar: 12px;      /* Kopfzeilen-Inseln, Werkzeug-, Kontext-, Zoom-, Sitzungsleiste */
	--k-radius-panel: 12px;    /* Panels, Menüs, Popover */
	--k-radius-dialog: 16px;
	--k-radius-control: var(--border-radius-element, 8px); /* Knöpfe innen */
	--k-radius-pill: 999px;    /* Chips, Hinweise */

	/* Ebenen (V15): Leiste < Panel/Menü < Dialog. Kein Rand, nur Schatten. */
	--k-z-canvas: 0;
	--k-z-bar: 10;
	--k-z-contextbar: 20;
	--k-z-panel: 30;
	--k-z-menu: 40;
	--k-z-notice: 45;
	--k-z-dialog: 50;
	--k-shadow-color: var(--color-box-shadow-rgb, 0, 0, 0);
	--k-shadow-bar: 0 1px 2px rgba(var(--k-shadow-color), .08), 0 2px 6px rgba(var(--k-shadow-color), .06);
	--k-shadow-panel: 0 2px 4px rgba(var(--k-shadow-color), .08), 0 8px 24px rgba(var(--k-shadow-color), .12);
	--k-shadow-dialog: 0 8px 16px rgba(var(--k-shadow-color), .12), 0 24px 56px rgba(var(--k-shadow-color), .22);
	--k-backdrop: rgba(0, 0, 0, .32);

	/* Leistenhöhen und Fingerziele */
	--k-btn: 36px;             /* Maus */
	--k-btn-touch: 44px;       /* Stift/Finger (Tablet, Telefon) – WCAG 2.5.5 */
	--k-bar-pad: 4px;
	--k-bar-h: calc(var(--k-btn) + 2 * var(--k-bar-pad));          /* 44px */
	--k-bar-h-touch: calc(var(--k-btn-touch) + 2 * var(--k-bar-pad)); /* 52px */
	--k-icon: 20px;            /* Material Design Icons, Umriss-Variante (V5) */
	--k-panel-w: 296px;        /* Formen-, Kommentar-, Abstimmungs-Panel */
	--k-menu-min-w: 240px;     /* NcActions-Menüs; deutsche Texte ~30 % länger */

	/* Fokus: Hauptfarbe des Textes, damit er auf hell und dunkel sichtbar bleibt */
	--k-focus-ring: 0 0 0 2px var(--k-surface), 0 0 0 4px var(--k-text);

	/* Schrift: eine Familie für Leisten und Leinwand (V7) */
	--k-font: var(--font-face, system-ui, -apple-system, "Segoe UI", Roboto, Oxygen-Sans, Cantarell, Ubuntu, "Noto Sans", "Liberation Sans", Arial, sans-serif);
	--k-ui-size: 15px;         /* Nextcloud --default-font-size */
	--k-ui-size-small: 13px;

	--k-motion: 120ms cubic-bezier(.2, 0, 0, 1);
}

@media (prefers-reduced-motion: reduce) {
	:root { --k-motion: 0ms linear; }
}

/* ───────────────────────── Teil 2 · Leinwand ───────────────────────── */
:root, .knorke {
	--canvas-bg: #f3f2f0;          /* oklch(.962 .003 100) – neutraler als heute #f1f1ec */
	--canvas-text: #191b1d;        /* oklch(.22 .005 250) – 15,44:1 auf der Leinwand */
	--canvas-text-muted: #5c5f63;  /* 5,74:1 auf der Leinwand */
	--canvas-font: var(--k-font);  /* heute Arial; jetzt dieselbe Schrift wie die Leisten */

	/* ── Die eine Palette (V6) ──
	   Reihenfolge überall gleich: Notiz, Form, Verbinder, Mindmap-Ast, Tag, Personenfarbe.
	   -light  = Notiz/Füllung, dunkler Text darauf (Kontrast zu --canvas-text)
	   -strong = Linie, Text, Ast, Tag, Personenfarbe (Kontrast zu Weiß / zur Leinwand)
	   -ondark = Linie auf dunkler Leinwand, nur Dunkelmodus (a) (Kontrast zu --canvas-bg-dark)   */

	/*  #  Name       light                 strong                 ondark
	   01 Hellblau   #a2d9fe  11,43:1      #0275a9  5,10 / 4,56   #3a91c3  4,52   oklch h238  (Standard neuer Notizen)
	   02 Türkis     #8fe7e1  12,08:1      #087c77  5,05 / 4,51   #399792  4,52   oklch h190
	   03 Salbei     #b3e8b3  12,43:1      #307d37  5,10 / 4,56   #5c975e  4,54   oklch h145
	   04 Gelb       #faea89  14,14:1      #7e6f01  5,05 / 4,51   #988a38  4,53   oklch h100
	   05 Orange     #febf87  10,71:1      #a25d04  5,12 / 4,57   #bf7a35  4,55   oklch h62
	   06 Koralle    #ffaaa7   9,51:1      #c43e45  5,09 / 4,55   #d56a69  4,58   oklch h22
	   07 Rosa       #f9b7d6  10,50:1      #b94082  5,10 / 4,56   #cb699b  4,53   oklch h350
	   08 Lila       #d9b9ee   9,97:1      #9550bb  5,07 / 4,53   #ab75cb  4,61   oklch h312
	   09 Indigo     #b9c8fc  10,47:1      #5165d3  5,06 / 4,52   #7085de  4,58   oklch h272
	   10 Sand       #e1ceb0  11,23:1      #816b46  5,09 / 4,55   #9a886a  4,59   oklch h80
	   11 Weiß       #ffffff  17,27:1      –  (Linie fällt auf Grau)
	   12 Grau       #e0e0dd  13,06:1      #6f6f6d  5,04 / 4,50   #a7a9ac  5,92 (auf #2b2c30)
	   13 Schwarz    #191b1d  (weißer Text 17,27:1)   #191b1d  17,27 / 15,44   #e6e7e8 12,74
	   Kleinster Abstand zweier heller Töne: ΔE(OKLab) 0,049 (Hellblau/Indigo) – heute 0,02 (zwei Rosa). */
	--pal-hellblau-light: #a2d9fe; --pal-hellblau-strong: #0275a9; --pal-hellblau-ondark: #3a91c3;
	--pal-tuerkis-light:  #8fe7e1; --pal-tuerkis-strong:  #087c77; --pal-tuerkis-ondark:  #399792;
	--pal-salbei-light:   #b3e8b3; --pal-salbei-strong:   #307d37; --pal-salbei-ondark:   #5c975e;
	--pal-gelb-light:     #faea89; --pal-gelb-strong:     #7e6f01; --pal-gelb-ondark:     #988a38;
	--pal-orange-light:   #febf87; --pal-orange-strong:   #a25d04; --pal-orange-ondark:   #bf7a35;
	--pal-koralle-light:  #ffaaa7; --pal-koralle-strong:  #c43e45; --pal-koralle-ondark:  #d56a69;
	--pal-rosa-light:     #f9b7d6; --pal-rosa-strong:     #b94082; --pal-rosa-ondark:     #cb699b;
	--pal-lila-light:     #d9b9ee; --pal-lila-strong:     #9550bb; --pal-lila-ondark:     #ab75cb;
	--pal-indigo-light:   #b9c8fc; --pal-indigo-strong:   #5165d3; --pal-indigo-ondark:   #7085de;
	--pal-sand-light:     #e1ceb0; --pal-sand-strong:     #816b46; --pal-sand-ondark:     #9a886a;
	--pal-weiss-light:    #ffffff;
	--pal-grau-light:     #e0e0dd; --pal-grau-strong:     #6f6f6d; --pal-grau-ondark:     #a7a9ac;
	--pal-schwarz-light:  #191b1d; --pal-schwarz-strong:  #191b1d; --pal-schwarz-ondark:  #e6e7e8;

	--note-default: var(--pal-hellblau-light);   /* bleibt Hellblau, bewusst nicht Gelb */

	/* Notizen */
	--note-size: 180;              /* Kantenlänge in Leinwand-Einheiten */
	--note-radius: 6px;            /* heute 3px */
	--note-padding: 16px;
	--note-shadow: 0 1px 2px rgba(0,0,0,.10), 0 3px 8px rgba(0,0,0,.08); /* heute 0 2px 6px .25 */
	/* Notiztext (V7): drei feste Stufen, Standard M. „Auto“ verkleinert nur, wenn M nicht passt,
	   in Schritten bis --note-text-min; nie größer als die gewählte Stufe. */
	--note-text-s: 16px;
	--note-text-m: 22px;
	--note-text-l: 32px;
	--note-text-min: 12px;
	--note-line-height: 1.25;
	--note-weight: 400;

	/* Text-Werkzeug */
	--text-s: 16px; --text-m: 22px; --text-l: 32px; --text-xl: 44px;

	/* Frames (V7): Kopf im Frame, dunkel und halbfett */
	--frame-fill: #ffffff;
	--frame-stroke: #8a8c8e;       /* 3,02:1 zur Leinwand, 3,37:1 zu Weiß */
	--frame-stroke-width: 1.5px;
	--frame-radius: 8px;
	--frame-head-h: 56px;
	--frame-title-size: 24px;      /* heute 28px grau über dem Frame */
	--frame-title-weight: 600;
	--frame-title-color: var(--canvas-text);

	/* Swimlanes */
	--lane-head-w: 150px;
	--lane-head-fill: #f3f2f0;     /* = Leinwand, ruhiger als rgba(0,0,0,.05) */
	--lane-title-size: 20px;       /* ≥ Notiztext S, heute ~11px */
	--lane-title-weight: 600;
	--lane-divider: var(--frame-stroke);

	/* Formen und Verbinder */
	--shape-stroke: var(--pal-schwarz-strong);
	--shape-stroke-width: 2px;     /* Stufen: 1 / 2 / 4 */
	--shape-radius-rounded: 12px;
	--shape-text-size: 20px;
	--connector-stroke: #3d4044;   /* 9,31:1 zur Leinwand */
	--connector-width: 2px;
	--connector-label-size: 16px;
	--connector-label-bg: var(--canvas-bg);

	/* Mindmap: Äste nehmen die -strong-Töne in Palettenreihenfolge */
	--mindmap-root-fill: #ffffff;
	--mindmap-root-stroke: var(--canvas-text);
	--mindmap-root-size: 22px;
	--mindmap-branch-size: 18px;
	--mindmap-branch-width: 3px;

	/* Auswahl (V8): nur Eckgriffe in der Primärfarbe */
	--sel-color: var(--k-accent);
	--sel-outline-width: 1.5px;
	--sel-handle: 10px;            /* Maus; Stift/Finger 14px sichtbar, 44px Trefferfläche */
	--sel-handle-touch: 14px;
	--sel-handle-fill: #ffffff;
	--sel-rotate-reveal: 24px;     /* Drehgriff erscheint im Abstand ≤ 24px zur Ecke */
	--sel-anchor-reveal: 16px;     /* Verbindungspunkte erscheinen ≤ 16px zur Kante */
	--sel-anchor: 10px;            /* liegen auf der Kante, nie auf dem Nachbarobjekt */

	/* Andere Personen (V17): feste Farbe je Konto = -strong-Ton aus hash(userId) mod 10 */
	--peer-label-size: 13px;
	--peer-select-dash: 6 4;

	/* Sitzung */
	--vote-badge: 28px;            /* sichtbar; Trefferfläche 44px */
	--vote-badge-fill: var(--k-accent);
}

/* ───────────────────────── Teil 3 · Dunkelmodus ───────────────────────── */
/* Variante (a): Leinwand gedämpft dunkel, Notizen bleiben farbig und hell */
[data-k-dark="a"] {
	--canvas-bg: #202327;          /* oklch(.255 .008 255) */
	--canvas-text-on-bg: #e6e7e8;  /* 12,74:1 */
	--frame-fill: #2b2e32;
	--frame-stroke: #7d8084;       /* 3,98:1 zur Leinwand, 3,44:1 zur Frame-Fläche */
	--frame-title-color: #e6e7e8;
	--lane-head-fill: #25282c;
	--connector-stroke: #c9cbce;   /* 9,70:1 */
	--mindmap-root-fill: #2b2e32;
	--mindmap-root-stroke: #e6e7e8;
	--sel-handle-fill: #202327;
	/* Notizen behalten -light + dunklen Text; Linien/Äste/Tags nehmen -ondark.
	   Füllung „Weiß“ wird hier zur Frame-Fläche mit hellem Text, alles andere bleibt. */
}
/* Variante (b): Leinwand bleibt hell, Leisten dunkelgrau statt schwarz */
[data-k-dark="b"] {
	--k-surface: #2b2c30;          /* statt #171717 */
	--k-text: #ebebeb;             /* 11,70:1 */
	--k-text-muted: #b4b6b9;       /* 6,86:1 */
	--k-hover: #3a3b40;
	--k-shadow-bar: 0 1px 2px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.14);
}
</style>
<style>/* Knorke Prototyp · Darstellung. Tokens kommen aus tokens.css (wird beim Bauen eingesetzt). */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
	--nc-primary: #00679e;
	font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Liberation Sans", Arial, sans-serif;
	background: oklch(0.93 0.004 250); color: #222; overflow: hidden; display: grid; grid-template-rows: auto 1fr; height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: var(--k-icon, 20px); height: var(--k-icon, 20px); fill: currentColor; flex: none; display: block; }

/* ── Präsentationsrahmen (außerhalb des Produkts) ── */
.deck-bar { position: relative; padding: 10px 20px 10px; background: oklch(0.985 0.002 250); border-bottom: 1px solid oklch(0.88 0.004 250); z-index: 100; }
.deck-row { display: flex; align-items: center; gap: 16px; }
.deck-title { font-weight: 600; white-space: nowrap; font-size: 14px; }
.deck-title span { font-weight: 400; color: #5d5f63; }
.deck-views { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
.deck-views button { border: 0; background: transparent; padding: 5px 9px; border-radius: 8px; font-size: 13px; color: #3c3e42; font-variant-numeric: tabular-nums; }
.deck-views button:hover { background: oklch(0.93 0.004 250); }
.deck-views button[aria-current="true"] { background: #222; color: #fff; }
.deck-prim { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4a4c50; white-space: nowrap; }
.deck-prim button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #9a9ca0; padding: 0; }
.deck-prim button[aria-pressed="true"] { box-shadow: 0 0 0 2px #222; }
.deck-cap { margin-top: 8px; font-size: 13px; color: #3c3e42; display: flex; gap: 12px; align-items: baseline; }
.deck-cap b { font-weight: 600; color: #111; white-space: nowrap; }
.deck-cap .vs { color: #5d5f63; }
.stage { position: relative; overflow: hidden; display: grid; place-items: center; min-height: 0; }
.stage-inner { transform-origin: center center; display: flex; gap: 40px; align-items: center; }
.frame-label { font-size: 13px; color: #5d5f63; margin: 0 0 8px 4px; }

/* ── Gerät + Nextcloud-Hülle ── */
.device {
	--color-primary-element: var(--nc-primary);
	--color-primary-element-text: #ffffff;
	--color-primary-element-hover: color-mix(in oklch, var(--nc-primary) 86%, black);
	--color-primary-element-light: color-mix(in oklch, var(--nc-primary) 12%, white);
	--color-primary-element-light-text: color-mix(in oklch, var(--nc-primary) 72%, black);
	--color-main-background: #ffffff; --color-main-text: #222222; --color-text-maxcontrast: #6b6b6b;
	--color-background-hover: #f2f2f2; --color-border: #e6e6e6; --color-border-maxcontrast: #7f7f7f;
	--nc-shell: var(--nc-primary);
	position: relative; overflow: hidden; background: var(--nc-shell);
	background-image: radial-gradient(120% 80% at 100% 100%, color-mix(in oklch, var(--nc-primary) 55%, white) 0, transparent 60%), radial-gradient(90% 60% at 0% 0%, color-mix(in oklch, var(--nc-primary) 80%, black) 0, transparent 70%);
	font-family: var(--k-font); font-size: var(--k-ui-size); color: var(--k-text);
	box-shadow: 0 2px 6px rgba(0,0,0,.12), 0 18px 50px rgba(0,0,0,.16);
}
.device.desktop { width: 1440px; height: 900px; border-radius: 10px; }
.device.tablet { width: 820px; height: 1180px; border-radius: 28px; outline: 14px solid #1c1d20; }
.device.phone { width: 390px; height: 844px; border-radius: 44px; outline: 12px solid #1c1d20; }
.device.dark {
	--color-primary-element: color-mix(in oklch, var(--nc-primary) 66%, white);
	--color-primary-element-text: #0b0b0b;
	--color-primary-element-hover: color-mix(in oklch, var(--nc-primary) 56%, white);
	--color-primary-element-light: color-mix(in oklch, var(--nc-primary) 30%, #171717);
	--color-primary-element-light-text: #e8f2f8;
	--color-main-background: #171717; --color-main-text: #ebebeb; --color-text-maxcontrast: #adadad;
	--color-background-hover: #2a2a2a; --color-border: #333333; --color-border-maxcontrast: #8c8c8c;
	--nc-shell: color-mix(in oklch, var(--nc-primary) 30%, #0d1117);
	background-image: none;
	--k-shadow-color: 0, 0, 0;
}
.nc-header { height: 50px; display: flex; align-items: center; gap: 4px; padding: 0 12px; color: #fff; }
.device.phone .nc-header { padding-top: 0; }
.nc-logo { width: 62px; height: 31px; display: block; margin-right: 10px; }
.nc-hbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: none; border: 0; }
.nc-hbtn svg { width: 20px; height: 20px; fill: #fff; }
.nc-app { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 15px; padding: 0 8px; }
.nc-search { flex: 0 1 500px; margin: 0 auto; height: 34px; border-radius: 10px; background: rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center; gap: 8px; color: rgba(255,255,255,.92); font-size: 15px; }
.nc-search svg { fill: currentColor; width: 18px; height: 18px; }
.nc-right { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.nc-me { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: #fff; background: var(--pal-indigo-strong); box-shadow: 0 0 0 2px rgba(255,255,255,.85); margin-left: 6px; }
.nc-content { position: absolute; left: 8px; right: 8px; top: 50px; bottom: 8px; border-radius: 12px; overflow: hidden; background: var(--canvas-bg); }
.device.phone .nc-content, .device.tablet .nc-content { left: 0; right: 0; bottom: 0; border-radius: 12px 12px 0 0; }
.device.phone .nc-content { border-radius: 14px 14px 0 0; }

/* ── Leinwand ── */
.canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; forced-color-adjust: none; touch-action: none; }
.canvas text { font-family: var(--canvas-font); }
.ov { position: absolute; inset: 0; pointer-events: none; }
.ov > * { pointer-events: auto; }
svg.ov, svg.ov * { pointer-events: none !important; }
.hit { cursor: pointer; }

/* ── Inseln und Leisten (V1, V15) ── */
.bar { position: absolute; z-index: var(--k-z-bar); display: flex; align-items: center; gap: var(--k-gap); padding: var(--k-bar-pad); min-height: var(--k-bar-h); background: var(--k-surface); color: var(--k-text); border-radius: var(--k-radius-bar); box-shadow: var(--k-shadow-bar); border: 1px solid transparent; }
.bar.v { flex-direction: column; }
.touch .bar { min-height: var(--k-bar-h-touch); }
.grp { display: flex; align-items: center; gap: var(--k-gap); }
.bar.v .grp { flex-direction: column; }

<script>/* Knorke Prototyp · Leinwand als SVG (steht für Konva). Maße in Leinwand-Einheiten. */
const PAL_IDS = ['hellblau', 'tuerkis', 'salbei', 'gelb', 'orange', 'koralle', 'rosa', 'lila', 'indigo', 'sand', 'weiss', 'grau', 'schwarz'];
const PAL_NAMES = { hellblau: 'Hellblau', tuerkis: 'Türkis', salbei: 'Salbei', gelb: 'Gelb', orange: 'Orange', koralle: 'Koralle', rosa: 'Rosa', lila: 'Lila', indigo: 'Indigo', sand: 'Sand', weiss: 'Weiß', grau: 'Grau', schwarz: 'Schwarz' };
const PAL = {};
function readPalette() {
	const cs = getComputedStyle(document.documentElement);
	for (const id of PAL_IDS) {
		const g = n => cs.getPropertyValue(`--pal-${id}-${n}`).trim();
		PAL[id] = { id, name: PAL_NAMES[id], light: g('light'), strong: g('strong') || g('light'), ondark: g('ondark') || g('strong') };
	}
	PAL.weiss.strong = PAL.grau.strong; PAL.weiss.ondark = PAL.grau.ondark;
}
const lightOf = id => PAL[id].light;
const strongOf = (id, dark) => dark ? PAL[id].ondark : PAL[id].strong;

/* Text messen wie Konva: Canvas-2D mit derselben Schrift wie die Leisten (V7). */
const _ctx = document.createElement('canvas').getContext('2d');
let FONT = 'system-ui, sans-serif';
function tw(t, size, weight = 400) { _ctx.font = `${weight} ${size}px ${FONT}`; return _ctx.measureText(t).width; }
function wrap(text, size, maxW, weight) {
	const words = []; text.split(' ').forEach(w => { const parts = w.split(/(?<=-)/); parts.forEach((p, i) => words.push({ p, glue: i < parts.length - 1 })); });
	const lines = []; let cur = '';
	for (let i = 0; i < words.length; i++) {
		const { p } = words[i]; const prevGlue = i > 0 && words[i - 1].glue;
		const cand = cur ? cur + (prevGlue ? '' : ' ') + p : p;
		if (tw(cand, size, weight) <= maxW || !cur) cur = cand; else { lines.push(cur); cur = p; }
	}
	if (cur) lines.push(cur);
	const fits = lines.every(l => tw(l, size, weight) <= maxW);
	return { lines, fits };
}
/* V7: feste Stufe (Standard M = 22). Verkleinert wird nur, wenn der Text sonst nicht passt. */
function fitText(text, base, w, h, weight = 400) {
	for (let s = base; s >= 12; s -= 2) { const r = wrap(text, s, w, weight); if (r.fits && r.lines.length * s * 1.25 <= h) return { size: s, lines: r.lines }; }
	return { size: 12, lines: wrap(text, 12, w, weight).lines };
}
function textBlock(text, cx, cy, box, opt = {}) {
	const { size, lines } = fitText(text, opt.size || 22, box.w, box.h, opt.weight || 400);
	const lh = size * 1.25, y0 = cy - (lines.length - 1) * lh / 2;
	return `<text x="${cx}" y="${y0}" font-size="${size}" font-weight="${opt.weight || 400}" text-anchor="middle" dominant-baseline="central" style="fill:${opt.fill || 'var(--canvas-text)'}">${lines.map((l, i) => `<tspan x="${cx}" y="${y0 + i * lh}">${esc(l)}</tspan>`).join('')}</text>`;
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

/* ── Zusammensetzen ── */
function boardView() {

function render() {
	const d = S.device, root = document.getElementById('stage-inner');
	readPalette();
	root.innerHTML = `<div><div class="frame-label">${{ desktop: 'Desktop · 1440 × 900', tablet: 'Tablet mit Stift · 820 × 1180', phone: 'Telefon · 390 × 844' }[d]}</div><div class="device knorke ${d}${S.dark ? ' dark' : ''}${isTouch() ? ' touch' : ''}"${S.dark ? ` data-k-dark="${S.dark}"` : ''} data-od-id="device-${d}">${ncHeader(d)}<div class="nc-content" id="content">${S.screen === 'list' ? listView() : boardView()}</div></div></div>`;

	const dl = document.querySelector('.dialog'); if (dl && !dl.contains(document.activeElement)) dl.querySelector('input, .btn.primary, button')?.focus();
}
function rel(el, root) { let x = 0, y = 0, e = el; while (e && e !== root) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { l: x, t: y, r: x + el.offsetWidth, b: y + el.offsetHeight }; }
function place() {
	const root = document.getElementById('content'); if (!root) return;
	const W = root.offsetWidth, H = root.offsetHeight, v = { ...VT[S.device] };
	const ctx = root.querySelector('.ctx');
	let sb = null;
	if (ctx && S.sel) {
		sb = screenBox(v, S.sel); const w = ctx.offsetWidth, h = ctx.offsetHeight, minL = S.device === 'phone' ? 8 : (S.device === 'desktop' ? 60 : 68);
		let l = (sb.l + sb.r) / 2 - w / 2, t = sb.t - 8 - h;
		if (t < (S.device === 'desktop' ? 60 : 70)) t = sb.b + 8;
		l = Math.max(minL, Math.min(W - w - 8, l));
		ctx.style.left = l + 'px'; ctx.style.top = t + 'px';
	}
	const pop = root.querySelector('.pop[data-for]'); if (!pop) return;
	const a = root.querySelector(`[data-anchor="${pop.dataset.for}"]`); if (!a) return;
	const r = rel(a, root), pw = pop.offsetWidth, ph = pop.offsetHeight, side = pop.dataset.side;
	let l = r.l, t = r.b + 8;
	if (side === 'below-end') l = r.r - pw;
	if (side === 'right') { l = r.r + 12; t = r.t - 8; }
	if (side === 'above-end') { l = r.r - pw; t = r.t - 8 - ph; }
	if (pop.dataset.avoid && sb && l < sb.r && l + pw > sb.l && t < sb.b && t + ph > sb.t) { l = sb.r + 12; t = Math.max(60, r.b + 8 - 0); if (t < sb.t - 0 && t + ph > sb.t) t = Math.max(60, sb.t - 52); }
	l = Math.max(8, Math.min(W - pw - 8, l)); t = Math.max(8, Math.min(H - ph - 8, t));
	pop.style.left = l + 'px'; pop.style.top = t + 'px';
}
function fit() {
	const st = document.querySelector('.stage'), inner = document.getElementById('stage-inner'), d = DEV[S.device];
	const pad = S.device === 'desktop' ? 24 : 40;
	SCALE = Math.min(1, (st.clientWidth - pad * 2) / (d.w + 28), (st.clientHeight - pad * 2 - 24) / (d.h + 28 + 24));
	inner.style.transform = `scale(${SCALE})`;
}
function deck() {
	const vw = VIEWS.find(x => x[0] === VIEW);
	document.getElementById('deck-views').innerHTML = VIEWS.map(([id, t]) => `<button data-act="view" data-arg="${id}" aria-current="${id === VIEW}" title="${t}">${id}</button>`).join('');
	document.getElementById('deck-cap').innerHTML = vw ? `<b>${vw[0]} · ${vw[1]}</b><span>${vw[2]}</span><span class="vs">${vw[3].split(' ').join(' · ')}</span>` : '';
}
function go(id) {

	VIEW = id; S = Object.assign(BASE(), JSON.parse(JSON.stringify(vw[4])));

	try { localStorage.setItem('knorke-proto-view', id); } catch (e) { }
	render();
}
Object.assign(window, { go, render, place, fit, rel });

<script>/* Knorke Prototyp · Bedienung (Klick, Rechtsklick, langes Drücken, Tastatur) */
function setPrimary(c) { document.body.style.setProperty('--nc-primary', c); document.querySelectorAll('.deck-prim button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.arg === c))); try { localStorage.setItem('knorke-proto-primary', c); } catch (e) { } }
let suppressClick = false;
function handle(act, arg, el, e, inPop) {
	const prevPop = S.pop;
	if (!inPop && act !== 'pop') { S.pop = null; S.popLevel = 'root'; }
	switch (act) {
		case 'pop': S.pop = prevPop === arg ? null : arg; S.popLevel = 'root'; break;
		case 'level': S.popLevel = arg; break;
		case 'canvas': S.sel = null; S.hint = null; S.pen = false; break;
		case 'sel': if (S.device === 'phone') { S.sel = null; break; } S.sel = arg; S.hint = null; S.pen = false; break;
		case 'tool': {
			S.sel = null;
			if (arg === 'shape') { S.panel = S.panel === 'shapes' ? null : 'shapes'; S.tool = S.panel ? 'shape' : 'select'; S.pop = null; break; }
			if (arg === 'more') { S.pop = prevPop === 'moretools' ? null : 'moretools'; break; }
			const t = TOOLS.find(x => x.id === arg);
			if (t && t.vars && S.tool === arg) { S.pop = prevPop === 'var-' + arg ? null : 'var-' + arg; break; }
			S.tool = arg; S.pop = null; if (S.panel === 'shapes') S.panel = null; break;
		}
		case 'var-note': S.vars.note = arg; S.tool = 'note'; S.pop = null; break;
		case 'var-frame': S.vars.frame = arg; S.tool = 'frame'; S.pop = null; break;
		case 'var-route': S.vars.route = arg; S.tool = 'connector'; S.pop = 'var-connector'; break;
		case 'var-head': S.vars.head = arg; S.tool = 'connector'; S.pop = 'var-connector'; break;
		case 'panel': S.panel = S.panel === arg ? null : arg; if (arg === 'shapes' && !S.panel) S.tool = 'select'; break;
		case 'ctab': S.colorTab = arg; S.pop = 'color'; break;
		case 'color': { const ids = S.sel === 'multi' ? SCENE.notes.map(n => n.id) : [S.sel]; ids.forEach(id => { const o = byId(id); if (o) o.c = arg; }); S.pop = 'color'; break; }
		case 'tsize': { const n = byId(S.sel); if (n) n.size = { S: 16, M: 22, L: 32, Auto: 22 }[arg]; S.pop = 'color'; break; }
		case 'vote': { const c = S.votes[arg] || 0; if (el.classList.contains('vote-hit') && c > 0) S.votes[arg] = c - 1; else if (remaining() > 0) S.votes[arg] = c + 1; break; }
		case 'unvote': S.votes[arg] = Math.max(0, (S.votes[arg] || 0) - 1); break;
