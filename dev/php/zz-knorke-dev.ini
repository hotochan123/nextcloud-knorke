;
; Dev stack only (dev/up.sh mounts it read-only into conf.d). The nextcloud
; image sets opcache.revalidate_freq=60: a changed PHP file of the mounted app
; would then run in its old version for up to a minute. 0 = check the file
; timestamp on every request.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
